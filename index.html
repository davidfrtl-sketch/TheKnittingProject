<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaleco Raglan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eceee7;
    --surface: #f8f9f4;
    --surface-raised: #ffffff;
    --text: #1c1f1a;
    --text-muted: #5c6156;
    --line: #d7d9cf;
    --line-strong: #b9bcae;
    --accent: #1f5c57;
    --accent-strong: #12403c;
    --accent-soft: #d9ece9;
    --accent-ink: #0f3733;
    --copper: #a1572e;
    --copper-soft: #f2e2d4;
    --plum: #6b3b58;
    --plum-soft: #ecdfe6;
    --error-bg: #f7dede;
    --error-text: #7a1f1f;
    --shadow: 0 1px 2px rgba(20, 24, 18, 0.06), 0 6px 20px -8px rgba(20, 24, 18, 0.18);
    --font-display: "Fraunces", "Iowan Old Style", "Palatino Linotype", serif;
    --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141815;
      --surface: #1b201c;
      --surface-raised: #212722;
      --text: #e7e9e1;
      --text-muted: #9aa093;
      --line: #2d332c;
      --line-strong: #3c4339;
      --accent: #6fcfc2;
      --accent-strong: #8fe0d4;
      --accent-soft: #1d3733;
      --accent-ink: #b7ecdf;
      --copper: #e0995f;
      --copper-soft: #3a2a1c;
      --plum: #cf93b7;
      --plum-soft: #362530;
      --error-bg: #3a1e1e;
      --error-text: #f0b4b4;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -8px rgba(0, 0, 0, 0.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
  }
  .page { max-width: 1000px; margin: 0 auto; padding: 32px 20px 64px; display: flex; flex-direction: column; gap: 28px; }
  h1 { font-family: var(--font-display); font-size: clamp(28px, 4vw, 40px); margin: 0; }
  .lede { color: var(--text-muted); max-width: 68ch; margin: 0; }
  fieldset {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px 16px;
    margin: 0;
    background: var(--surface-raised);
  }
  legend { font-family: var(--font-body); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); padding: 0 6px; }
  .field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--text-muted); }
  input[type="number"] {
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--text);
  }
  form { display: flex; flex-direction: column; gap: 16px; }
  button {
    align-self: flex-start;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  button:hover { background: var(--accent-strong); }
  #error-box {
    background: var(--error-bg);
    color: var(--error-text);
    border-radius: 8px;
    padding: 12px 16px;
    font-family: var(--font-mono);
    font-size: 13px;
  }
  #result-box { display: flex; flex-direction: column; gap: 20px; }
  .result-card {
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .result-card h2 { font-family: var(--font-display); font-size: 20px; margin: 0 0 12px; }
  #svg-container { overflow-x: auto; }
  #svg-container svg { width: 100%; height: auto; min-width: 500px; color: var(--text); }
  .panel-fill { fill: var(--surface); stroke: var(--text); stroke-width: 0.4; stroke-linejoin: round; }
  .panel-fill.front { fill: var(--accent-soft); }
  .panel-fill.sleeve { fill: var(--copper-soft); }
  .panel-title { font-family: var(--font-body); font-weight: 600; font-size: 4.5px; text-anchor: middle; fill: var(--text-muted); text-transform: uppercase; }
  .measure-label { font-family: var(--font-mono); font-size: 3.6px; text-anchor: middle; fill: var(--text); }
  .axila-line { stroke: var(--plum); stroke-width: 0.3; stroke-dasharray: 1.4 1; }
  #instructions-container {
    font-family: var(--font-mono);
    font-size: 13px;
    white-space: pre-wrap;
    margin: 0;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Chaleco Raglan</h1>
    <p class="lede">Ingresá tu gauge y tus medidas para calcular el esquema y las instrucciones de un sweater/chaleco raglan con escote redondo, a tu talla.</p>
  </header>

  <form id="measurements-form">
    <fieldset>
      <legend>Gauge (por 10cm)</legend>
      <div class="field-grid">
        <label>Puntos <input type="number" id="stitchesPer10cm" value="20" step="any"></label>
        <label>Filas <input type="number" id="rowsPer10cm" value="28" step="any"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Ease</legend>
      <div class="field-grid">
        <label>Cuerpo (cm) <input type="number" id="bodyEaseCm" value="8" step="any"></label>
        <label>Manga (cm) <input type="number" id="sleeveEaseCm" value="6" step="any"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Medidas del cuerpo (cm)</legend>
      <div class="field-grid">
        <label>Pecho <input type="number" id="chestCm" value="96" step="any"></label>
        <label>Cuello espalda <input type="number" id="neckWidthBackCm" value="16" step="any"></label>
        <label>Bíceps <input type="number" id="bicepCm" value="32" step="any"></label>
        <label>Profundidad de sisa <input type="number" id="armholeDepthCm" value="20" step="any"></label>
        <label>Cintura <input type="number" id="waistCm" value="80" step="any"></label>
        <label>Cadera <input type="number" id="hipCm" value="98" step="any"></label>
        <label>Muñeca <input type="number" id="wristCm" value="12" step="any"></label>
        <label>Axila → cintura <input type="number" id="waistLengthCm" value="15" step="any"></label>
        <label>Cintura → ruedo <input type="number" id="hemLengthCm" value="12.14" step="any"></label>
        <label>Largo de manga <input type="number" id="sleeveLengthCm" value="42.14" step="any"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Escote (crew)</legend>
      <div class="field-grid">
        <label>Rondas abiertas <input type="number" id="frontOpenRounds" value="12" step="any"></label>
        <label>Puntos iniciales por mitad <input type="number" id="frontStartStitchesPerHalf" value="1" step="any"></label>
        <label>Cadencia de aumento <input type="number" id="necklineIncreaseCadence" value="1" step="any"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Construcción</legend>
      <div class="field-grid">
        <label>Montado inicial de manga <input type="number" id="initialSleeveStitchesPerSleeve" value="8" step="any"></label>
      </div>
    </fieldset>

    <button type="button" id="calculate-button">Calcular</button>
  </form>

  <div id="error-box" role="alert" hidden></div>

  <div id="result-box" hidden>
    <div class="result-card">
      <h2>Esquema</h2>
      <div id="svg-container"></div>
    </div>
    <div class="result-card">
      <h2>Instrucciones</h2>
      <pre id="instructions-container"></pre>
    </div>
  </div>
</div>
<script type="module" src="./dist/web/app.js"></script>
</body>
</html>
